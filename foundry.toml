[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
cache_path = "cache"

solc_version = "0.8.26"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./test/fixtures" }, { access = "read-write", path = "./deployments" }]
additional_compiler_profiles = [{ name = "safe", via_ir = false }]
compilation_restrictions = [{ paths = "lib/safe-contracts/contracts/Safe.sol", via_ir = false }]

remappings = [
  "@redstone-finance/evm-connector/=lib/redstone/packages/evm-connector/",
  "@uniswap/v4-core/=lib/v4-periphery/lib/v4-core/",
  "@uniswap/v4-periphery/=lib/v4-periphery/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "permit2/=lib/permit2/",
  "solmate/=lib/v4-periphery/lib/v4-core/lib/solmate/",
  "forge-std/=lib/v4-periphery/lib/v4-core/lib/forge-std/src/",
  "safe-contracts/=lib/safe-contracts/contracts/",
  "ds-test/=lib/v4-periphery/lib/v4-core/lib/forge-std/lib/ds-test/src/",
]


[fuzz]
runs = 256

[invariant]
runs = 64
depth = 32

[rpc_endpoints]
aurora_testnet = "${AURORA_TESTNET_RPC}"
